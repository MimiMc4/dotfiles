[general]
import = [
    "~/.config/alacritty/themes/alacritty-theme/themes/catppuccin_macchiato.toml"
]

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[window]
opacity = 0.9
dimensions.columns = 115
dimensions.lines = 30

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"
